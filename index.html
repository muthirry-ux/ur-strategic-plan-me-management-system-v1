:root{--bg:#0b1426;--pn:#101c33;--pn2:#14233f;--bd:#22335a;--tx:#e8eefb;--mu:#93a3c4;--ac:#f2b32c;--bl:#4aa3ff;--pu:#6f6cf0;--ok:#3ccf8e;--wn:#f2b32c;--er:#ef6a7a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef2f9;--pn:#fff;--pn2:#f3f6fc;--bd:#d3dcee;--tx:#10213f;--mu:#5a6b8c;--ac:#b9810a;--bl:#1f7ae0;--pu:#4b48c8;--ok:#14935d;--wn:#b9810a;--er:#c93a4c;color-scheme:light}}
:root[data-theme="light"]{--bg:#eef2f9;--pn:#fff;--pn2:#f3f6fc;--bd:#d3dcee;--tx:#10213f;--mu:#5a6b8c;--ac:#b9810a;--bl:#1f7ae0;--pu:#4b48c8;--ok:#14935d;--wn:#b9810a;--er:#c93a4c;color-scheme:light}

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Arial,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--pn);border-bottom:3px solid var(--ac);flex-wrap:wrap}
.logo{width:46px;height:46px;border-radius:50%;object-fit:cover;display:block;background:#fff}.msg .logo{width:84px;height:84px;margin:0 auto 12px}
header b{font-size:17px}header small{color:var(--mu)}.sp{flex:1}
select,input,button,textarea{font:inherit;color:var(--tx);background:var(--pn2);border:1px solid var(--bd);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button.pri{background:var(--ac);color:#10213f;border-color:var(--ac);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--bl);outline-offset:2px}
.wrap{display:flex;min-height:calc(100vh - 66px)}
nav{width:230px;background:var(--pn);border-right:1px solid var(--bd);padding:14px 0;flex:none}
nav h6{margin:14px 18px 6px;font-size:12px;color:var(--mu);font-weight:600}
nav button{display:block;width:100%;text-align:left;border:0;border-left:3px solid transparent;border-radius:0;background:none;padding:9px 18px}
nav button.on{background:var(--pn2);border-left-color:var(--ac);color:var(--ac);font-weight:600}
main{flex:1;padding:20px;min-width:0}
h1{margin:0 0 2px;font-size:24px}.sub{color:var(--mu);margin-bottom:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:14px}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:14px 16px}
.card h3{margin:0 0 10px;font-size:15px}.k{color:var(--mu);font-size:12px}.big{font-size:28px;font-weight:700}
.bar{height:7px;background:var(--bg);border-radius:4px;overflow:hidden;margin:6px 0 4px}.bar i{display:block;height:100%}
.two{display:grid;gap:14px;grid-template-columns:2fr 1fr}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}.row span:first-child{width:46%;font-size:13px}.row .bar{flex:1;margin:0}.row em{width:44px;text-align:right;font-style:normal;color:var(--mu)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:760px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}th{font-size:12px;color:var(--mu);font-weight:600}
td input[type=number]{width:96px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.chart{display:flex;align-items:flex-end;gap:14px;height:190px;padding-top:10px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--mu)}
.chart .b{width:100%;display:flex;align-items:flex-end;gap:3px;height:150px}.chart .b i{flex:1;border-radius:3px 3px 0 0;min-height:2px}
.tag{padding:2px 8px;border-radius:10px;background:var(--pn2);border:1px solid var(--bd);font-size:12px}
.msg{max-width:560px;margin:12vh auto;text-align:center}
form.f{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
@media(max-width:820px){.wrap{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;padding:0}nav h6{display:none}nav button{white-space:nowrap;border-left:0;border-bottom:3px solid transparent}nav button.on{border-bottom-color:var(--ac)}.two{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-bottom:14px}.tile{padding:12px 6px;text-align:center;background:var(--pn)}.tile.on{border-color:var(--bl);background:var(--pn2);color:var(--bl);font-weight:600}.tile small{display:block;color:var(--mu);font-weight:400}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.fl input{flex:1;min-width:200px}

 <div class="card tw"><table><tr><th>Activity</th><th>Goal</th><th>Entity</th><th>Owner</th><th>Timeline</th><th>Budget (RWF)</th><th>Progress</th><th>Status</th></tr>${A.sort((a,b)=>(a.due||"").localeCompare(b.due||"")).map(a=>{const w=canPlan(a.entity),late=a.status!=="Done"&&a.due&&a.due<today;return `<tr><td>${a.kpi?`<span class="tag">${esc(a.kpi)}</span> `:""}${esc(a.title)}${a.output?`<br><span class="k">Output: ${esc(a.output)}</span>`:""}</td><td>G${+a.goal+1}</td><td>${esc(a.entity)}</td><td>${esc(a.owner||"")}</td><td style="${late?"color:var(--er)":""}">${esc(a.start||"–")} → ${esc(a.due||"–")}${late?" · overdue":""}</td><td>${fmt(a.budget)}</td><td style="min-width:130px"><div class="bar"><i style="width:${a.progress||0}%;background:${rag((a.progress||0)/100)}"></i></div>${w?`<input type="number" min="0" max="100" data-pg="${esc(a.id)}" value="${a.progress??""}" style="width:70px" aria-label="Progress percent for ${esc(a.title)}"> %`:(a.progress||0)+"%"}</td><td>${w?`<select data-aid="${esc(a.id)}">${ST.map(x=>`<option ${a.status===x?"selected":""}>${x}</option>`).join("")}</select>`:esc(a.status)}</td></tr>`}).join("")||'<tr><td colspan="8" class="k">No activities for this selection. Upload an annual plan or add an activity.</td></tr>'}</table></div>
 <h3 style="margin-top:18px">Implementation progress reports</h3><div class="card tw"><table><tr><th>Activity</th><th>Period</th><th>Progress</th><th>Status</th><th>Spend (RWF)</th><th>Narrative</th><th>Reported by</th></tr>${hist.map(z=>`<tr><td>${esc((S.acts.find(a=>a.id===z.aid)||{}).title||z.aid)}</td><td>${z.q?"Q"+z.q:"Annual"}</td><td>${z.pct}%</td><td>${esc(z.status||"–")}</td><td>${fmt(z.spend)}</td><td>${esc(z.note||"")}</td><td>${esc(z.by)}</td></tr>`).join("")||'<tr><td colspan="7" class="k">No progress reports yet for this year.</td></tr>'}</table></div>`};
boot().catch(e=>msg("Something went wrong",esc(e.message||e)));
</script></body></html>
